[project]
name = "simple-calculator"
version = "0.1.0"
description = "Kalkulator sederhana berbasis console dengan struktur project yang rapi"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]

[project.scripts]
calc = "calculator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calculator"]